<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>冰島行程</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif; background: #f5f5f5; }
  .tabbar {
    display: flex;
    background: #1f2937;
    padding-top: env(safe-area-inset-top);
  }
  .tabbar button {
    flex: 1;
    padding: 12px 4px;
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tabbar button.active {
    color: #fff;
    border-bottom-color: #2f7d68;
  }
  .frames {
    position: absolute;
    top: 46px;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .frames iframe {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border: none;
    display: none;
  }
  .frames iframe.active { display: block; }
  .frames { top: calc(46px + env(safe-area-inset-top)); }
</style>
</head>
<body>
  <div class="tabbar">
    <button data-tab="app" class="active">行程App</button>
    <button data-tab="itinerary">行程總覽</button>
    <button data-tab="compare">比價評估</button>
  </div>
  <div class="frames">
    <iframe id="frame-app" class="active" data-src="app/index.html"></iframe>
    <iframe id="frame-itinerary" data-src="itinerary.html"></iframe>
    <iframe id="frame-compare" data-src="tour-compare.html"></iframe>
  </div>
  <script>
    var buttons = document.querySelectorAll('.tabbar button');
    var frames = document.querySelectorAll('.frames iframe');

    function activate(tab) {
      buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
      frames.forEach(function (f) {
        var isActive = f.id === 'frame-' + tab;
        f.classList.toggle('active', isActive);
        if (isActive && !f.src) f.src = f.dataset.src;
      });
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () { activate(b.dataset.tab); });
    });

    activate('app');
  </script>
</body>
</html>
