<script>
(function () {
  var STORAGE_KEY = 'iceland-tour-compare-v1';

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { liked: {}, notes: {}, order: {} };
    } catch (e) { return { liked: {}, notes: {}, order: {} }; }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = loadState();
  state.liked = state.liked || {};
  state.notes = state.notes || {};
  state.order = state.order || {}; // optId -> { cat: catId, index: number }
  state.collapsed = state.collapsed || {};

  // Build lookup: optId -> {catId, option}
  var allOptions = {};
  TOUR_DATA.forEach(function (cat) {
    cat.options.forEach(function (opt) {
      allOptions[opt.id] = { cat: cat.id, opt: opt };
    });
  });

  function computeDisplayOrder() {
    // groups: catId -> array of optIds, honoring manual overrides in state.order
    var groups = {};
    TOUR_DATA.forEach(function (cat) { groups[cat.id] = []; });

    // Start from default: options sorted by cpScore desc (nulls last, keep original order among nulls)
    var defaultGroups = {};
    TOUR_DATA.forEach(function (cat) {
      var opts = cat.options.slice();
      var scored = opts.filter(function (o) { return o.cpScore !== null && o.cpScore !== undefined; });
      var unscored = opts.filter(function (o) { return o.cpScore === null || o.cpScore === undefined; });
      scored.sort(function (a, b) { return b.cpScore - a.cpScore; });
      defaultGroups[cat.id] = scored.concat(unscored).map(function (o) { return o.id; });
    });

    // Apply overrides
    var placed = {};
    Object.keys(state.order).forEach(function (optId) {
      if (!allOptions[optId]) return;
      var ov = state.order[optId];
      if (!groups[ov.cat]) return;
      groups[ov.cat].push(optId);
      placed[optId] = true;
    });
    // Fill remaining from default order, respecting original category
    Object.keys(defaultGroups).forEach(function (catId) {
      defaultGroups[catId].forEach(function (optId) {
        if (!placed[optId]) {
          groups[catId].push(optId);
          placed[optId] = true;
        }
      });
    });
    // Sort each group's overridden items by their stored index where present
    Object.keys(groups).forEach(function (catId) {
      groups[catId].sort(function (a, b) {
        var ai = state.order[a] ? state.order[a].index : 999 + defaultGroups[catId].indexOf(a);
        var bi = state.order[b] ? state.order[b].index : 999 + defaultGroups[catId].indexOf(b);
        return ai - bi;
      });
    });
    return groups;
  }

  function scoreColor(score) {
    if (score === null || score === undefined) return null;
    return score;
  }

  function renderOption(optId, rankInGroup) {
    var entry = allOptions[optId];
    if (!entry) return document.createDocumentFragment();
    var opt = entry.opt;
    var div = document.createElement('div');
    div.className = 'opt' + (state.liked[optId] ? ' liked' : '');
    div.draggable = true;
    div.dataset.optId = optId;

    var rankHtml = '';
    if (opt.cpScore !== null && opt.cpScore !== undefined) {
      rankHtml = '<span class="rank">#' + rankInGroup + ' CP值' + Math.round(opt.cpScore * 100) + '</span>';
    } else {
      rankHtml = '<span class="rank unranked">資料不足，暫不排序</span>';
    }

    var statsParts = [];
    if (opt.price) statsParts.push('💰 <b>' + opt.price + '</b>');
    if (opt.review) statsParts.push('⭐ ' + opt.review);
    if (opt.duration) statsParts.push('⏱️ ' + opt.duration);
    if (opt.cancel) statsParts.push('🔁 ' + opt.cancel);

    var stopsHtml = '';
    if (opt.stops && opt.stops.length) {
      stopsHtml = '<div class="stops">' + opt.stops.map(function (s) {
        return '<span class="stoptag">' + s.name + (s.tag ? '（' + s.tag + '）' : '') + '</span>';
      }).join('') + '</div>';
    }

    var gapsHtml = '';
    if (opt.dataGaps && opt.dataGaps.length) {
      gapsHtml = '<div class="gaps">' + opt.dataGaps.map(function (g) { return '<div>⚠️ ' + g + '</div>'; }).join('') + '</div>';
    }

    var noteVal = state.notes[optId] || '';

    div.innerHTML =
      '<span class="draghandle">⠿</span>' +
      '<input type="checkbox" class="likecheck" ' + (state.liked[optId] ? 'checked' : '') + '>' +
      '<div class="body">' +
        '<div class="row1"><span class="source">' + opt.source + '</span><span class="name">' + opt.name + '</span>' + rankHtml + '</div>' +
        '<div class="stats">' + statsParts.join(' ｜ ') + '</div>' +
        stopsHtml + gapsHtml +
        (opt.url ? '<a class="link popuplink" href="' + opt.url + '" target="_blank" rel="noopener">查看原始頁面 ↗</a>' : '') +
        '<div><button class="notebtn" type="button">' + (noteVal ? '✎ 編輯記事' : '＋ 加記事') + '</button></div>' +
        '<textarea class="note" placeholder="寫下你自己的想法…" style="display:' + (noteVal ? 'block' : 'none') + '">' + noteVal + '</textarea>' +
      '</div>';

    // checkbox
    div.querySelector('.likecheck').addEventListener('change', function (e) {
      state.liked[optId] = e.target.checked;
      div.classList.toggle('liked', e.target.checked);
      saveState();
    });

    // note toggle
    var noteBtn = div.querySelector('.notebtn');
    var noteArea = div.querySelector('.note');
    noteBtn.addEventListener('click', function () {
      var showing = noteArea.style.display !== 'none';
      noteArea.style.display = showing ? 'none' : 'block';
      if (!showing) noteArea.focus();
    });
    noteArea.addEventListener('input', function () {
      state.notes[optId] = noteArea.value;
      noteBtn.textContent = noteArea.value ? '✎ 編輯記事' : '＋ 加記事';
      saveState();
    });

    // NOTE: browsers ignore window.open() size/position hints when the page
    // is running inside a sandboxed iframe (which this Artifact is), so a
    // "small side popup" isn't achievable here — this just opens a normal tab.

    // drag events
    div.addEventListener('dragstart', function (e) {
      div.classList.add('dragging');
      e.dataTransfer.setData('text/plain', optId);
      e.dataTransfer.effectAllowed = 'move';
    });
    div.addEventListener('dragend', function () {
      div.classList.remove('dragging');
    });

    return div;
  }

  function render() {
    var container = document.getElementById('categories');
    container.innerHTML = '';
    var groups = computeDisplayOrder();

    TOUR_DATA.forEach(function (cat) {
      var card = document.createElement('div');
      card.className = 'catcard' + (state.collapsed[cat.id] ? ' collapsed' : '');
      card.dataset.catId = cat.id;

      var head = document.createElement('div');
      head.className = 'cathead';
      head.innerHTML =
        '<div class="titles"><h2>' + cat.title + '</h2><div class="ctx">' + (cat.dayContext || '') + '</div></div>' +
        '<span class="chev">▾</span>';
      head.addEventListener('click', function () {
        card.classList.toggle('collapsed');
        state.collapsed[cat.id] = card.classList.contains('collapsed');
        saveState();
      });
      card.appendChild(head);

      var body = document.createElement('div');
      body.className = 'catbody';

      if (cat.warning) {
        var w = document.createElement('div');
        w.className = 'catwarn';
        w.textContent = cat.warning;
        body.appendChild(w);
      }

      var list = document.createElement('div');
      list.className = 'optlist';
      list.dataset.catId = cat.id;

      var ids = groups[cat.id] || [];
      var rank = 0;
      ids.forEach(function (optId) {
        var entry = allOptions[optId];
        if (entry && entry.opt.cpScore !== null && entry.opt.cpScore !== undefined) rank++;
        list.appendChild(renderOption(optId, rank));
      });

      // drop zone handlers
      list.addEventListener('dragover', function (e) {
        e.preventDefault();
        list.classList.add('dragover');
        e.dataTransfer.dropEffect = 'move';
      });
      list.addEventListener('dragleave', function () {
        list.classList.remove('dragover');
      });
      list.addEventListener('drop', function (e) {
        e.preventDefault();
        list.classList.remove('dragover');
        var optId = e.dataTransfer.getData('text/plain');
        if (!optId || !allOptions[optId]) return;

        // figure out drop position: find nearest .opt under pointer
        var after = null;
        var children = Array.prototype.slice.call(list.querySelectorAll('.opt'));
        for (var i = 0; i < children.length; i++) {
          var rect = children[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) { after = children[i]; break; }
        }
        var targetCat = list.dataset.catId;
        var newIds = (groups[targetCat] || []).filter(function (id) { return id !== optId; });
        var insertIdx = after ? newIds.indexOf(after.dataset.optId) : newIds.length;
        if (insertIdx < 0) insertIdx = newIds.length;
        newIds.splice(insertIdx, 0, optId);

        // remove from old group if different
        var oldEntry = allOptions[optId];
        if (oldEntry) {
          var oldCatInGroups = null;
          Object.keys(groups).forEach(function (cId) {
            if (cId !== targetCat && groups[cId].indexOf(optId) !== -1) {
              groups[cId] = groups[cId].filter(function (id) { return id !== optId; });
            }
          });
        }
        groups[targetCat] = newIds;

        // persist full order across all groups
        Object.keys(groups).forEach(function (cId) {
          groups[cId].forEach(function (id, idx) {
            state.order[id] = { cat: cId, index: idx };
          });
        });
        saveState();
        render();
      });

      body.appendChild(list);
      card.appendChild(body);
      container.appendChild(card);
    });
  }

  document.getElementById('btnExpandAll').addEventListener('click', function () {
    TOUR_DATA.forEach(function (cat) { state.collapsed[cat.id] = false; });
    saveState(); render();
  });
  document.getElementById('btnCollapseAll').addEventListener('click', function () {
    TOUR_DATA.forEach(function (cat) { state.collapsed[cat.id] = true; });
    saveState(); render();
  });
  document.getElementById('btnResetOrder').addEventListener('click', function () {
    state.order = {};
    saveState(); render();
  });

  render();
})();
</script>
